id: zabbix-default-password

info:
  name: Zabbix 默认口令漏洞
  author: god
  severity: medium
  description: Zabbix 监控系统使用默认账号密码 Admin/zabbix 可登录
  metadata:
    fofa-query: app="ZABBIX-监控系统"
  tags: zabbix,weak-password

http:
- raw:
  - |
    @timeout: 15s
    POST /zabbix/api_jsonrpc.php HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/json-rpc

    {"jsonrpc":"2.0","method":"user.login","params":{"user":"Admin","password":"zabbix"},"id":1}

  max-redirects: 0
  matchers-condition: and
  matchers:
    - type: word
      part: body
      words:
        - "result"
      condition: and
    - type: word
      part: body
      words:
        - "error"
      negate: true
